services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clawbada
      POSTGRES_PASSWORD: clawbada
      POSTGRES_DB: clawbada
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawbada"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: deps
    working_dir: /app
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://clawbada:clawbada@postgres:5432/clawbada
    depends_on:
      postgres:
        condition: service_healthy
    # Copy full source for migration scripts
    volumes:
      - .:/app
      - /app/node_modules

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://clawbada:clawbada@postgres:5432/clawbada
      REDIS_URL: redis://redis:6379
      API_PORT: "3001"
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      CHAIN_ENV: ${CHAIN_ENV:-testnet}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-0x}
      # V3 battle sessions: one drand beacon per real battle at team reveal.
      DRAND_CHAIN_URL: ${DRAND_CHAIN_URL:-https://api.drand.sh}
      BATTLE_SHOT_CLOCK_MS: ${BATTLE_SHOT_CLOCK_MS:-60000}
      BOT_THINK_MS: ${BOT_THINK_MS:-800}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://clawbada:clawbada@postgres:5432/clawbada
      REDIS_URL: redis://redis:6379
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      CHAIN_ENV: ${CHAIN_ENV:-testnet}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-0x}
      DRAND_CHAIN_URL: ${DRAND_CHAIN_URL:-https://api.drand.sh}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  indexer:
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://clawbada:clawbada@postgres:5432/clawbada
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      CHAIN_ENV: ${CHAIN_ENV:-testnet}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NEXT_PUBLIC_WS_URL: ws://api:3001/ws
    depends_on:
      - api

volumes:
  pgdata:
