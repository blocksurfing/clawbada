# Non-secret runtime configuration of the Cloud Run service `clawbada-api` (docs/runbooks/cloud-run.md).
# Applied with `gcloud run services update clawbada-api --env-vars-file docker/cloud-run.api.env.yaml`; a
# plain deploy (scripts/deploy-api.sh) never touches it. Secrets (DATABASE_URL, AUTH_SESSION_SECRET,
# BATTLE_SEED_SECRET) live in Secret Manager and are bound with --set-secrets, never here.
# Every value is a string. PORT is injected by Cloud Run (--port 3001); never set API_PORT here.
CHAIN_ENV: "testnet"
BASE_SEPOLIA_RPC_URL: "https://sepolia.base.org"
# A placeholder until the matchmaker contract is deployed (required at boot, 0x-validated).
MATCHMAKER_ADDRESS: "0x000000000000000000000000000000000000dEaD"
# EIP-4361 `domain` the web app signs with (the WEB hosts, not this API's). The first is the default for callers
# that send no X-Auth-Domain (agents).
AUTH_DOMAINS: "clawbada-web.vercel.app,clawbada.com"
# Web pages allowed to use this API from a browser — both the REST API (CORS) and sockets (lib/ws-origin.ts). Listed
# outright: left unset, the built-in default also admits any host shaped like one of this project's Vercel previews.
WS_ALLOWED_ORIGINS: "https://clawbada.com,https://docs.clawbada.com,https://clawbada-web.vercel.app"
# Google's front ends APPEND the connecting IP to X-Forwarded-For; TRUST_PROXY_HOPS counts the trailing entries
# they add. Measured 2026-10-22 behind the load balancer: the API sees "<client>, <lb ip>" — Cloud Run appends nothing more.
TRUST_PROXY: "true"
TRUST_PROXY_HOPS: "2"
PRACTICE_ENABLED: "true"
# Preset rosters (the Dojo's team builder) without on-chain lobsters — a product decision, on since launch.
PRACTICE_PRESETS: "true"
GUEST_SESSIONS_ENABLED: "true"
BATTLE_SESSIONS_ENABLED: "true"
# Cloud SQL's shared-core tier allows ~25 connections in total; the API keeps 5 (engine 5, indexer 3 later).
DB_POOL_MAX: "5"
# Shares of the one instance, at their defaults (set to change): live off-chain battles in all (PRACTICE_MAX_LIVE, 500)
# and per client IP (PRACTICE_MAX_LIVE_PER_IP, 6); open sockets per client IP (WS_PER_IP_MAX_CONCURRENT, 16) and in
# all (WS_MAX_SOCKETS, 600).
# CHAIN_ROUTES: on|off — the contract-backed routes (mining, teams, market, breeding, evolution, repair, boost, faucet)
# open by themselves once LOBSTER_NFT_ADDRESS is set by the Sepolia deploy; set this only to force them either way
# (lib/chain-gate.ts).
# LOBSTER_RENDER_ENABLED: "true" — not set, so GET /api/game/render/… answers 404 here. Drawing a lobster costs CPU on
# the thread that runs the battles; read lib/render-gate.ts for what has to be in place before this is switched on.
LOG_LEVEL: "info"
# The 13 *_ADDRESS contract variables are added here by the Sepolia deploy (docs/runbooks/testnet-deploy.md §6);
# they are read lazily, and practice never touches them.
