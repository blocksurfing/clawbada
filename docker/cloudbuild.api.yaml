# Cloud Build recipe for `scripts/deploy-api.sh --remote`. Mirrors the local buildx command; needed because
# the Dockerfile lives under docker/, which `gcloud builds submit --tag` cannot express. The push happens
# through `images`.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--platform', 'linux/amd64', '-f', 'docker/api.Dockerfile', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: ''
timeout: 1200s
