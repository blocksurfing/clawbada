name: Docker Build
# Every action is pinned to a commit, with its release in the trailing comment: a tag can be moved to different
# code after the fact, a commit cannot. To update one, take the commit its new release tag points to.

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # One image failing must not cancel the others: each image is deployed on its own
      # (api → Cloud Run via scripts/deploy-api.sh), so a web build break should not hide the state of the api image.
      fail-fast: false
      matrix:
        app: [api, engine, indexer, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
