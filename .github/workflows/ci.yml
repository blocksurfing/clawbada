name: CI
# Every action is pinned to a commit, with its release in the trailing comment: a tag can be moved to different
# code after the fact, a commit cannot. To update one, take the commit its new release tag points to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The Bun that builds production (docker/api.Dockerfile, Vercel). `latest` let CI pass on a Bun nothing ships with.
  BUN_VERSION: 1.3.14

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # No personal home-directory paths in tracked files (scripts/identity-guard.ts).
      - run: bun scripts/identity-guard.ts --tree
      # The repo's own tooling, which no workspace test run covers.
      - run: bun test scripts/identity-guard.test.ts scripts/audit-check.test.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Per-workspace runs (root "test" script = `bun run --filter '*' test`).
      # bun's mock.module() is process-global and accumulative, so a root-level
      # `bun test` lets one app's module mocks leak into another app's suite
      # (apps/api mocking drizzle-orm broke apps/engine's epoch-job tests).
      - run: bun run test

  abi-freshness:
    name: ABI freshness (packages/chain/src/abis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: forge build
      - run: bun run extract-abis
      # A11 regressed twice because ABIs were regenerated by hand. If the checked-in ABIs
      # differ from what the current contracts produce, fail here with the diff.
      - run: git diff --exit-code -- packages/chain/src/abis

  forge-test:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: forge test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run --filter @clawbada/web build
