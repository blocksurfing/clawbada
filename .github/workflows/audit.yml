name: Dependency audit
# Watches the dependency tree for newly published advisories. It runs on its own schedule and is not a pull-request
# check: the advisories already known (scripts/audit-baseline.json) do not fail it, a new one does. See
# scripts/audit-check.ts. Actions are pinned to commits, as in ci.yml.

on:
  schedule:
    # Mondays 07:00 UTC.
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'bun.lock'
      - 'scripts/audit-check.ts'
      - 'scripts/audit-baseline.json'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: New advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Reads bun.lock and asks the registry; no install needed.
      - run: bun scripts/audit-check.ts
