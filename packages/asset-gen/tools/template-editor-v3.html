    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = tierLabels[t];
    item.appendChild(c);
    item.appendChild(lbl);
    tierRow.appendChild(item);
  }

  for (let c = 0; c < CLASS_NAMES.length; c++) {
    const item = document.createElement('div');
    item.className = 'preview-item';
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128;
    cv.style.width = '64px'; cv.style.height = '64px';
    cv.id = `classPrev${c}`;
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = CLASS_NAMES[c];
    item.appendChild(cv);
    item.appendChild(lbl);
    classRow.appendChild(item);
  }
}

function getMergedTierData(maxTier) {
  // Merge all layers with tier <= maxTier, bottom to top
  const merged = new Uint8Array(W * H).fill(TRANSPARENT);
  for (let i = 0; i < S.layers.length; i++) {
    const l = S.layers[i];
    if (!l.visible || l.tier < 0 || l.tier > maxTier) continue;
    for (let j = 0; j < W * H; j++) {
      if (l.data[j] !== TRANSPARENT) merged[j] = l.data[j];
    }
  }
  return merged;
}

function updateTierPreviews() {
  const pal = CLASS_PALETTES[S.classAffinity];
  for (let t = 0; t < 4; t++) {
    const cv = document.getElementById(`tierPrev${t}`);
    const pctx = cv.getContext('2d');
    pctx.clearRect(0, 0, 128, 128);
    const data = getMergedTierData(t);
    const size = TIER_SIZES[t];
    const off = Math.floor((W - size) / 2);
    const scale = 2;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (x < off || x >= off+size || y < off || y >= off+size) continue;
        const r = data[y*W+x];
        if (r === TRANSPARENT) continue;
        pctx.fillStyle = rgb(resolveColor(r, pal));
        pctx.fillRect(x*scale, y*scale, scale, scale);
      }
    }
  }
}

function updateClassPreviews() {
  const merged = getMergedTierData(3);
  for (let c = 0; c < CLASS_NAMES.length; c++) {
    const cv = document.getElementById(`classPrev${c}`);
    const pctx = cv.getContext('2d');
    pctx.clearRect(0, 0, 128, 128);
    const pal = CLASS_PALETTES[c];
    const scale = 2;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const r = merged[y*W+x];
        if (r === TRANSPARENT) continue;
        pctx.fillStyle = rgb(resolveColor(r, pal));
        pctx.fillRect(x*scale, y*scale, scale, scale);
      }
    }
  }
}

function initCompositePreview() {
  const row = document.getElementById('compositePreviews');
  // Keep the label, remove any existing canvases
  while (row.children.length > 1) row.removeChild(row.lastChild);
  const labels = ['Base','Evolved','Elite','Apex'];
  for (let t = 0; t < 4; t++) {
    const item = document.createElement('div');
    item.className = 'preview-item';
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    c.style.width = '64px'; c.style.height = '64px';
    c.style.imageRendering = 'pixelated';
    c.id = `compPrev${t}`;
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = labels[t];
    item.appendChild(c);
    item.appendChild(lbl);
    row.appendChild(item);
  }
}

function updateCompositePreview() {
  if (!S.compositeMode) return;
  const pal = CLASS_PALETTES[S.classAffinity];
  const scale = 2;
  for (let t = 0; t < 4; t++) {
    const cv = document.getElementById(`compPrev${t}`);
    if (!cv) continue;
    const pctx = cv.getContext('2d');
    pctx.clearRect(0, 0, 128, 128);
    const size = TIER_SIZES[t];
    const off = Math.floor((W - size) / 2);
    // Composite body parts in LAYER_ORDER (back to front)
    for (const bpIdx of LAYER_ORDER) {
      const merged = new Uint8Array(W * H).fill(TRANSPARENT);
      for (let i = 0; i < S.layers.length; i++) {
        const l = S.layers[i];
        if (l.bodyPart !== bpIdx) continue;
        if (l.tier < 0 || l.tier > t) continue;
        if (!l.visible) continue;
        for (let j = 0; j < W * H; j++) {
          if (l.data[j] !== TRANSPARENT) merged[j] = l.data[j];
        }
      }
      for (let y = off; y < off + size; y++) {
        for (let x = off; x < off + size; x++) {
          const r = merged[y * W + x];
          if (r === TRANSPARENT) continue;
          pctx.fillStyle = rgb(resolveColor(r, pal));
          pctx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }
  }
}

// ════════════════════════════════════════════════════════════════════
// SECTION 13: IMPORT / EXPORT
// ════════════════════════════════════════════════════════════════════
function exportJSON() {
  const pixels = [];
  let minX = W, minY = H, maxX = -1, maxY = -1;

  for (let t = 0; t < 4; t++) {
    const merged = new Uint8Array(W * H).fill(TRANSPARENT);
    // Merge layers for this tier (bottom to top)
    for (let i = 0; i < S.layers.length; i++) {
      const l = S.layers[i];
      if (l.tier !== t) continue;
      for (let j = 0; j < W*H; j++) {
        if (l.data[j] !== TRANSPARENT) merged[j] = l.data[j];
      }
    }
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const r = merged[y*W+x];
        if (r === TRANSPARENT) continue;
        pixels.push({x, y, role: r, tier: t});
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }

  const exportBodyPart = S.compositeMode && activeLayer().bodyPart >= 0 ? BODY_PARTS[activeLayer().bodyPart] : S.bodyPart;
  const template = {
    bodyPart: exportBodyPart,
    classAffinity: S.classAffinity,
    version: 2,
    width: 64, height: 64,
    anchor: DEFAULT_ANCHORS[exportBodyPart] || {x:32,y:32},
    bounds: pixels.length > 0 ? {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1} : {x:0,y:0,w:0,h:0},
    mutationZones: S.zones.map(z => ({x:z.x,y:z.y,w:z.w,h:z.h,allowed:z.allowed})),
    pixels,
    ...(S.customColors.length > 0 ? { customColors: S.customColors } : {}),
  };

  downloadFile(JSON.stringify(template, null, 2), `${CLASS_NAMES[S.classAffinity].toLowerCase()}.json`, 'application/json');
}

function exportAllParts() {
  let exported = 0;
  for (let bp = 0; bp < 6; bp++) {
    const bpLayers = S.layers.filter(l => l.bodyPart === bp);
    if (bpLayers.length === 0) continue;
    const hasPixels = bpLayers.some(l => l.data.some(v => v !== TRANSPARENT));
    if (!hasPixels) continue;

    const pixels = [];
    let minX = W, minY = H, maxX = -1, maxY = -1;
    for (let t = 0; t < 4; t++) {
      const merged = new Uint8Array(W * H).fill(TRANSPARENT);
      for (const l of bpLayers) {
        if (l.tier !== t) continue;
        for (let j = 0; j < W * H; j++) {
          if (l.data[j] !== TRANSPARENT) merged[j] = l.data[j];
        }
      }
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const r = merged[y * W + x];
          if (r === TRANSPARENT) continue;
          pixels.push({x, y, role: r, tier: t});
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }

    const template = {
      bodyPart: BODY_PARTS[bp],
      classAffinity: S.classAffinity,
      version: 2,
      width: 64, height: 64,
      anchor: DEFAULT_ANCHORS[BODY_PARTS[bp]] || {x:32,y:32},
      bounds: pixels.length > 0 ? {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1} : {x:0,y:0,w:0,h:0},
      mutationZones: S.zones.map(z => ({x:z.x,y:z.y,w:z.w,h:z.h,allowed:z.allowed})),
      pixels,
      ...(S.customColors.length > 0 ? { customColors: S.customColors } : {}),
    };

    downloadFile(JSON.stringify(template, null, 2), `${BODY_PARTS[bp]}_${CLASS_NAMES[S.classAffinity].toLowerCase()}.json`, 'application/json');
    exported++;
  }
  if (exported === 0) alert('No body parts have assigned layers with pixels. Assign layers to body parts first.');
}

function importJSON(json) {
  try {
    const t = JSON.parse(json);
    saveUndo();

    if (t.version === 1) {
      // v1: 48x48, no tier. Center in 64x64.
      const ox = Math.floor((64 - 48) / 2);
      const oy = Math.floor((64 - 48) / 2);
      S.layers = [makeLayer('Base', 0)];
      S.activeLayerIdx = 0;
      for (const p of (t.pixels || [])) {
        setP(S.layers[0], p.x + ox, p.y + oy, p.role);
      }
      S.zones = (t.mutationZones || []).map(z => ({...z, x: z.x+ox, y: z.y+oy}));
    } else {
      // v2
      const bpIdx = BODY_PARTS.indexOf(t.bodyPart || '');
      const tierMap = {};
      for (const p of (t.pixels || [])) {
        const tier = p.tier ?? 0;
        if (!tierMap[tier]) tierMap[tier] = makeLayer(TIER_NAMES[tier] || `Tier ${tier}`, tier, bpIdx >= 0 ? bpIdx : -1);
        setP(tierMap[tier], p.x, p.y, p.role);
      }
      S.layers = [];
      for (let ti = 0; ti < 4; ti++) {
        if (tierMap[ti]) S.layers.push(tierMap[ti]);
      }
      if (S.layers.length === 0) S.layers.push(makeLayer('Base', 0));
      S.activeLayerIdx = 0;
      S.zones = t.mutationZones || [];
    }

    S.bodyPart = t.bodyPart || 'carapace';
    S.classAffinity = t.classAffinity ?? 0;
    S.customColors = t.customColors || [];
    document.getElementById('selBodyPart').value = S.bodyPart;
    document.getElementById('selClass').value = S.classAffinity;
    buildLayerPanel();
    buildPaletteBar();
    buildCustomColorBar();
    updateZoneList();
    S.previewDirty = true;
    render();
  } catch (err) {
    alert('Failed to parse JSON: ' + err.message);
  }
}

function saveWorkspace() {
  const ws = {
    type: 'clawbada-workspace',
    version: 1,
    bodyPart: S.bodyPart,
    classAffinity: S.classAffinity,
    layers: S.layers.map(l => ({
      name: l.name, tier: l.tier, bodyPart: l.bodyPart, visible: l.visible, opacity: l.opacity,
      data: btoa(String.fromCharCode(...l.data))
    })),
    activeLayerIdx: S.activeLayerIdx,
    zones: S.zones,
    customColors: S.customColors,
    compositeMode: S.compositeMode,
    bodyPartFilter: S.bodyPartFilter,
  };
  downloadFile(JSON.stringify(ws), `${S.bodyPart}-${CLASS_NAMES[S.classAffinity].toLowerCase()}.clwb`, 'application/json');
}

function loadWorkspace(json) {
  try {
    const ws = JSON.parse(json);
    if (ws.type !== 'clawbada-workspace') { alert('Not a valid workspace file'); return; }
    saveUndo();
    S.bodyPart = ws.bodyPart || 'carapace';
    S.classAffinity = ws.classAffinity ?? 0;
    S.layers = ws.layers.map(l => {
      const layer = makeLayer(l.name, l.tier, l.bodyPart ?? -1);
      layer.visible = l.visible;
      layer.opacity = l.opacity;
      const bytes = atob(l.data);
      for (let i = 0; i < bytes.length && i < W*H; i++) layer.data[i] = bytes.charCodeAt(i);
      return layer;
    });
    S.activeLayerIdx = Math.min(ws.activeLayerIdx || 0, S.layers.length - 1);
    S.zones = ws.zones || [];
    S.customColors = ws.customColors || [];
    S.compositeMode = ws.compositeMode || false;
    S.bodyPartFilter = ws.bodyPartFilter || [true, true, true, true, true, true];
    document.getElementById('optComposite').checked = S.compositeMode;
    document.getElementById('selBodyPart').value = S.bodyPart;
    document.getElementById('selClass').value = S.classAffinity;
    updateCompositeUI();
    buildLayerPanel();
    buildPaletteBar();
    buildCustomColorBar();
    updateZoneList();
    S.previewDirty = true;
    render();
  } catch (err) {
    alert('Failed to load workspace: ' + err.message);
  }
}

function importAllParts(files) {
  saveUndo();
  S.layers = [];
  let importedAny = false;
  let classAff = S.classAffinity;
  const pending = Array.from(files).map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const t = JSON.parse(ev.target.result);
        const bpIdx = BODY_PARTS.indexOf(t.bodyPart || '');
        if (bpIdx < 0) { resolve(); return; }
        if (t.classAffinity !== undefined) classAff = t.classAffinity;
        if (t.customColors) S.customColors = t.customColors;
        const tierMap = {};
        for (const p of (t.pixels || [])) {
          const tier = p.tier ?? 0;
          const key = `${bpIdx}_${tier}`;
          if (!tierMap[key]) tierMap[key] = makeLayer(`${BP_ABBREV[bpIdx]} ${TIER_NAMES[tier] || 'T' + tier}`, tier, bpIdx);
          setP(tierMap[key], p.x, p.y, p.role);
        }
        for (const l of Object.values(tierMap)) S.layers.push(l);
        importedAny = true;
      } catch (err) { /* skip invalid files */ }
      resolve();
    };
    reader.readAsText(file);
  }));
  Promise.all(pending).then(() => {
    if (!importedAny) { alert('No valid template files found.'); return; }
    if (S.layers.length === 0) S.layers.push(makeLayer('Base', 0));
    // Sort by LAYER_ORDER (body part z-order), then by tier
    const bpOrder = {};
    LAYER_ORDER.forEach((bp, idx) => bpOrder[bp] = idx);
    S.layers.sort((a, b) => (bpOrder[a.bodyPart] ?? 99) - (bpOrder[b.bodyPart] ?? 99) || a.tier - b.tier);
    S.activeLayerIdx = 0;
    S.classAffinity = classAff;
    S.compositeMode = true;
    document.getElementById('optComposite').checked = true;
    document.getElementById('selClass').value = S.classAffinity;
    updateCompositeUI();
    buildLayerPanel();
    buildPaletteBar();
    buildCustomColorBar();
    updateZoneList();
    S.previewDirty = true;
    render();
  });
}

function batchExportPNG() {
  const tierLabels = ['base', 'evolved', 'elite', 'apex'];
  const pal = CLASS_PALETTES[S.classAffinity];
  for (let t = 0; t < 4; t++) {
    const data = getMergedTierData(t);
    const size = TIER_SIZES[t];
    const off = Math.floor((W - size) / 2);
    const cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    const pctx = cv.getContext('2d');
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const r = data[(y+off)*W+(x+off)];
        if (r === TRANSPARENT) continue;
        const c = resolveColor(r, pal);
        pctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},1)`;
        pctx.fillRect(x, y, 1, 1);
      }
    }
    cv.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;

// ── API Key Security ──
// Keys are session-only by default (in-memory only).
// If user opts in to "Remember", keys are XOR-encrypted in localStorage
// with a per-browser fingerprint. Not cryptographically bulletproof,
// but prevents plaintext key leakage from localStorage inspection.
// NEVER embed keys in this HTML file.
// In PROXY mode, the real API key lives server-side — artist only has
// a revocable access token. See ai-proxy/README.md.

function keyFingerprint() {
  const raw = navigator.userAgent + screen.width + screen.height + (navigator.language || '');
  let hash = 0;
  for (let i = 0; i < raw.length; i++) { hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0; }
  return Math.abs(hash).toString(36).padStart(8, '0');
}

function xorEncrypt(text, key) {
  return Array.from(text).map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))).join('');
}

function encryptKey(apiKey) {
  const fp = keyFingerprint();
  return btoa(xorEncrypt(apiKey, fp));
}

function decryptKey(stored) {
  try {
    const fp = keyFingerprint();
    return xorEncrypt(atob(stored), fp);
  } catch { return ''; }
}

function saveKeyIfPersist(storageKey, value, persistCheckbox) {
  if (persistCheckbox.checked && value) {
    localStorage.setItem(storageKey, encryptKey(value));
    localStorage.setItem(storageKey + '_persist', '1');
  } else {
    localStorage.removeItem(storageKey);
    localStorage.removeItem(storageKey + '_persist');
  }
}

function loadPersistedKey(storageKey) {
  const persist = localStorage.getItem(storageKey + '_persist') === '1';
  const stored = localStorage.getItem(storageKey);
  if (persist && stored) return { key: decryptKey(stored), persist: true };
  return { key: '', persist: false };
}

// ── Generate via Proxy (artist mode) ──
async function generateViaProxy(prompt) {
  if (!S.proxyUrl) throw new Error('Enter the proxy URL first');
  if (!S.proxyToken) throw new Error('Enter your access token first');

  const provider = AI_PROVIDERS.find(p => p.id === 'retrodiffusion');
  const model = provider.models.find(m => m.id === S.aiModel) || provider.models[0];
  const size = Math.max(model.minSize, 64);

  const resp = await fetch(S.proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${S.proxyToken}` },
    body: JSON.stringify({
      prompt,
      width: size,
      height: size,
      num_images: 1,
      prompt_style: S.aiStyle,
    })
  });

  if (!resp.ok) {
    const errBody = await resp.json().catch(() => ({}));
    throw new Error(errBody.error || `Proxy error (${resp.status})`);
  }

  const data = await resp.json();
  if (data._remaining !== undefined) aiCostEl.textContent = `${data._remaining} generations left today`;

  if (!data.base64_images || !data.base64_images.length) throw new Error('No image returned from proxy');

  const b64 = data.base64_images[0];
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = `data:image/png;base64,${b64}`;
  });

  const tc = document.createElement('canvas');
  tc.width = 64; tc.height = 64;
  const tctx = tc.getContext('2d');
  tctx.imageSmoothingEnabled = false;
  tctx.drawImage(img, 0, 0, 64, 64);
  return tctx.getImageData(0, 0, 64, 64);
}

// ── Generate via RetroDiffusion (direct mode) ──
async function generateRetroDiffusion(prompt) {
  if (!S.rdKey) throw new Error('Enter your RetroDiffusion API key first');

  const provider = AI_PROVIDERS.find(p => p.id === 'retrodiffusion');
  const model = provider.models.find(m => m.id === S.aiModel) || provider.models[0];

  // RD_FAST supports 64x64 natively — perfect match
  const size = Math.max(model.minSize, 64);

  const resp = await fetch('https://api.retrodiffusion.ai/v1/inferences', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-RD-Token': S.rdKey },
    body: JSON.stringify({
      prompt,
      width: size,
      height: size,
      num_images: 1,
      prompt_style: S.aiStyle,
    })
  });

  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`RetroDiffusion error (${resp.status}): ${err}`);
  }

  const data = await resp.json();
  if (data.balance_cost !== undefined) aiCostEl.textContent = `Cost: ${data.balance_cost} credits`;

  if (!data.base64_images || !data.base64_images.length) throw new Error('No image returned');

  // Decode base64 → Image → 64x64 canvas
  const b64 = data.base64_images[0];
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = `data:image/png;base64,${b64}`;
  });

  const tc = document.createElement('canvas');
  tc.width = 64; tc.height = 64;
  const tctx = tc.getContext('2d');
  tctx.imageSmoothingEnabled = false;
  tctx.drawImage(img, 0, 0, 64, 64);
  return tctx.getImageData(0, 0, 64, 64);
}

// ── Generate via Replicate ──
async function generateReplicate(prompt) {
  if (!S.aiKey) throw new Error('Enter your Replicate API key first');

  const resp = await fetch('https://api.replicate.com/v1/predictions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${S.aiKey}`, 'Content-Type': 'application/json', 'Prefer': 'wait' },
    body: JSON.stringify({
      model: 'nerijs/pixel-art-xl',
      input: { prompt, width: 512, height: 512, num_inference_steps: 25, guidance_scale: 7.5 }
    })
  });

  let pred = await resp.json();

  // Poll if needed
  let attempts = 0;
  while ((pred.status === 'starting' || pred.status === 'processing') && attempts < 30) {
    await new Promise(r => setTimeout(r, 2000));
    const poll = await fetch(pred.urls.get, { headers: { 'Authorization': `Bearer ${S.aiKey}` } });
    pred = await poll.json();
    attempts++;
  }

  if (pred.status !== 'succeeded') throw new Error(pred.error || 'Generation failed');

  const imgUrl = Array.isArray(pred.output) ? pred.output[0] : pred.output;

  // Load image (CORS handling)
  let imgData;
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = imgUrl; });
    const tc = document.createElement('canvas');
    tc.width = 64; tc.height = 64;
    const tctx = tc.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(img, 0, 0, 64, 64);
    imgData = tctx.getImageData(0, 0, 64, 64);
  } catch {
    const blobResp = await fetch(imgUrl);
    const blob = await blobResp.blob();
    const bmpUrl = URL.createObjectURL(blob);
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = bmpUrl; });
    URL.revokeObjectURL(bmpUrl);
    const tc = document.createElement('canvas');
    tc.width = 64; tc.height = 64;
    const tctx = tc.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(img, 0, 0, 64, 64);
    imgData = tctx.getImageData(0, 0, 64, 64);
  }

  return imgData;
}

// ── Quantize image data to palette roles ──
function quantizeToRoles(imgData) {
  const pal = CLASS_PALETTES[S.classAffinity];
  const roles = new Uint8Array(64 * 64).fill(TRANSPARENT);
  for (let i = 0; i < 64 * 64; i++) {
    const r = imgData.data[i*4], g = imgData.data[i*4+1], b = imgData.data[i*4+2], a = imgData.data[i*4+3];
    if (a < 128) continue;
    let bestRole = 2, bestDist = Infinity;
    for (let ri = 0; ri < 7; ri++) {
      const pr = pal[ri][0], pg = pal[ri][1], pb = pal[ri][2];
      const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
      if (d < bestDist) { bestDist = d; bestRole = ri; }
    }
    // Also check custom colors
    for (let ci = 0; ci < S.customColors.length; ci++) {
      const cc = S.customColors[ci];
      const d = (r-cc[0])**2 + (g-cc[1])**2 + (b-cc[2])**2;
      if (d < bestDist) { bestDist = d; bestRole = 7 + ci; }
    }
    roles[i] = bestRole;
  }
  return roles;
}

// ── Draw quantized preview ──
function drawAiPreview(roles) {
  const pal = CLASS_PALETTES[S.classAffinity];
  aiPreviewCanvas.style.display = 'block';
  const pctx = aiPreviewCanvas.getContext('2d');
  pctx.clearRect(0, 0, 128, 128);
  for (let y = 0; y < 64; y++) {
    for (let x = 0; x < 64; x++) {
      const role = roles[y*64+x];
      if (role === TRANSPARENT) continue;
      pctx.fillStyle = rgb(resolveColor(role, pal));
      pctx.fillRect(x*2, y*2, 2, 2);
    }
  }
}

  if (S.selectedRole < 7) { alert('Select a custom color to remove.'); return; }
  const ci = S.selectedRole - 7;
  if (ci >= S.customColors.length) return;
  saveUndo();
  // Remap pixels: any pixel using this custom index → TRANSPARENT, shift higher indices down
  const removedIdx = 7 + ci;
  S.layers.forEach(l => {
    for (let i = 0; i < W * H; i++) {
      if (l.data[i] === removedIdx) l.data[i] = TRANSPARENT;
      else if (l.data[i] > removedIdx && l.data[i] !== TRANSPARENT) l.data[i]--;
    }
  });
  S.customColors.splice(ci, 1);
  S.selectedRole = Math.min(S.selectedRole, 6 + S.customColors.length);
  if (S.selectedRole < 0) S.selectedRole = 2;
  buildPaletteBar();
  buildCustomColorBar();
  S.previewDirty = true;
  render();
};

// Preview bar toggle
const previewContent = document.getElementById('previewContent');
const btnTogglePreviews = document.getElementById('btnTogglePreviews');
const previewCollapsedKey = 'clawbada_previews_collapsed';
if (localStorage.getItem(previewCollapsedKey) === '1') {
  previewContent.classList.add('collapsed');
  btnTogglePreviews.textContent = 'Previews ▼';
}
btnTogglePreviews.onclick = () => {
  const collapsed = previewContent.classList.toggle('collapsed');
  btnTogglePreviews.textContent = collapsed ? 'Previews ▼' : 'Previews ▲';
  localStorage.setItem(previewCollapsedKey, collapsed ? '1' : '0');
};

// Class & body part selects
const classSel = document.getElementById('selClass');
CLASS_NAMES.forEach((name, i) => {
  const label = i === 0 ? 'Base (No Class)' : `${i} - ${name}`;
  classSel.add(new Option(label, i));
});
classSel.onchange = function() { S.classAffinity = parseInt(this.value); buildPaletteBar(); buildCustomColorBar(); updateAiPrompt(); S.previewDirty = true; render(); };
document.getElementById('selBodyPart').onchange = function() { S.bodyPart = this.value; updateAiPrompt(); };

// ════════════════════════════════════════════════════════════════════
// SECTION 17: AUTO-SAVE (localStorage)
// ════════════════════════════════════════════════════════════════════
function autoSave() {
  try {
    const ws = {
      type: 'clawbada-workspace', version: 1,
      bodyPart: S.bodyPart, classAffinity: S.classAffinity,
      layers: S.layers.map(l => ({
        name: l.name, tier: l.tier, bodyPart: l.bodyPart, visible: l.visible, opacity: l.opacity,
        data: btoa(String.fromCharCode(...l.data))
      })),
      activeLayerIdx: S.activeLayerIdx,
      zones: S.zones,
      customColors: S.customColors,
      compositeMode: S.compositeMode,
      bodyPartFilter: S.bodyPartFilter,
    };
    localStorage.setItem('clawbada_editor_autosave', JSON.stringify(ws));
  } catch (e) { /* localStorage full or unavailable */ }
}

function tryAutoRestore() {
  try {
    const saved = localStorage.getItem('clawbada_editor_autosave');
    if (!saved) return;
    const ws = JSON.parse(saved);
    if (ws.type !== 'clawbada-workspace') return;
    S.bodyPart = ws.bodyPart || 'carapace';
    S.classAffinity = ws.classAffinity ?? 0;
    // Migrate old tier names to new naming convention
    const nameMap = { 'Core': 'Base', 'Form': 'Evolved', 'Detail': 'Elite', 'Ornamental': 'Apex' };
    S.layers = ws.layers.map(l => {
      const name = nameMap[l.name] || l.name;
      const layer = makeLayer(name, l.tier, l.bodyPart ?? -1);
      layer.visible = l.visible; layer.opacity = l.opacity;
      const bytes = atob(l.data);
      for (let i = 0; i < bytes.length && i < W*H; i++) layer.data[i] = bytes.charCodeAt(i);
      return layer;
    });
    S.activeLayerIdx = Math.min(ws.activeLayerIdx || 0, S.layers.length - 1);
    S.zones = ws.zones || [];
    S.customColors = ws.customColors || [];
    S.compositeMode = ws.compositeMode || false;
    S.bodyPartFilter = ws.bodyPartFilter || [true, true, true, true, true, true];
    document.getElementById('optComposite').checked = S.compositeMode;
    document.getElementById('selBodyPart').value = S.bodyPart;
    document.getElementById('selClass').value = S.classAffinity;
  } catch (e) { /* ignore restore errors */ }
}

setInterval(autoSave, 60000);

// ════════════════════════════════════════════════════════════════════
// SECTION 18: INITIALIZATION
// ════════════════════════════════════════════════════════════════════
tryAutoRestore();
updateCompositeUI();
initPreviews();
buildLayerPanel();
buildPaletteBar();
buildCustomColorBar();
updateAiPrompt();
updateAiUI();
updateZoneList();
S.previewDirty = true;
render();
</script>
</body>
