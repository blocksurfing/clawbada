<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clawbada Template Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar { width: 280px; background: #16213e; padding: 12px; overflow-y: auto; flex-shrink: 0; }
  .sidebar h2 { font-size: 14px; margin-bottom: 8px; color: #7df9ff; }
  .sidebar label { display: block; font-size: 11px; margin: 6px 0 2px; color: #aaa; }
  .sidebar select, .sidebar input { width: 100%; padding: 4px 6px; font-size: 12px; background: #0f3460; color: #e0e0e0; border: 1px solid #444; border-radius: 3px; margin-bottom: 4px; }
  .sidebar button { padding: 6px 12px; font-size: 12px; background: #0f3460; color: #7df9ff; border: 1px solid #7df9ff; border-radius: 3px; cursor: pointer; margin: 2px; }
  .sidebar button:hover { background: #1a4a8a; }
  .sidebar button.active { background: #7df9ff; color: #1a1a2e; }

  /* Palette bar */
  .palette-bar { display: flex; gap: 4px; margin: 8px 0; flex-wrap: wrap; }
  .palette-swatch { width: 32px; height: 32px; border: 2px solid #555; border-radius: 4px; cursor: pointer; position: relative; }
  .palette-swatch.selected { border-color: #fff; box-shadow: 0 0 6px #7df9ff; }
  .palette-swatch .role-label { position: absolute; bottom: -14px; left: 0; font-size: 9px; width: 32px; text-align: center; color: #888; }

  /* Canvas area */
  .main { flex: 1; display: flex; flex-direction: column; padding: 12px; }
  .canvas-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .canvas-wrapper canvas { image-rendering: pixelated; cursor: crosshair; }

  /* Preview strip */
  .preview-strip { display: flex; gap: 8px; padding: 12px 0; overflow-x: auto; align-items: flex-end; }
  .preview-strip .preview-item { text-align: center; }
  .preview-strip .preview-item canvas { image-rendering: pixelated; border: 1px solid #333; }
  .preview-strip .preview-item .label { font-size: 10px; color: #888; margin-top: 2px; }

  /* Status bar */
  .status-bar { background: #0f3460; padding: 4px 12px; font-size: 11px; color: #888; display: flex; justify-content: space-between; }

  /* Zone drawing */
  .zone-overlay { position: absolute; border: 2px dashed #ff6600; pointer-events: none; background: rgba(255, 102, 0, 0.1); }

  /* Sections */
  .section { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
  .row { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Clawbada Template Editor</h2>

  <div class="section">
    <label>Body Part</label>
    <select id="bodyPart">
      <option value="carapace">Carapace (HP)</option>
      <option value="claws">Claws (Attack)</option>
      <option value="tail">Tail (Speed)</option>
      <option value="antennae">Antennae (Critical)</option>
      <option value="eyes">Eyes (Armor)</option>
      <option value="legs">Legs (HP)</option>
    </select>

    <label>Class Affinity</label>
    <select id="classAffinity">
      <option value="0">0 - Bulwark</option>
      <option value="1">1 - Mantis</option>
      <option value="2">2 - Leviathan</option>
      <option value="3">3 - Tempest</option>
      <option value="4">4 - Specter</option>
      <option value="5">5 - Sentinel</option>
      <option value="6">6 - Reaver</option>
      <option value="7">7 - Abyss</option>
      <option value="8">8 - Kraken</option>
      <option value="9">9 - Ember</option>
    </select>
  </div>

  <div class="section">
    <label>Palette Role (paint color)</label>
    <div class="palette-bar" id="paletteBar"></div>
    <div class="row" style="margin-top: 4px;">
      <button id="btnEraser" title="Eraser (transparent)">Eraser</button>
      <button id="btnEyedrop" title="Pick role from canvas">Eyedrop</button>
    </div>
  </div>

  <div class="section">
    <label>Tools</label>
    <div class="row">
      <button id="btnDraw" class="active">Draw</button>
      <button id="btnLine">Line</button>
      <button id="btnRect">Rect</button>
      <button id="btnFill">Fill</button>
    </div>
    <div class="row" style="margin-top:4px;">
      <button id="btnZone">Zone</button>
      <button id="btnMirror">Mirror</button>
    </div>
  </div>

  <div class="section">
    <label>Mutation Zones</label>
    <div id="zoneList" style="font-size: 11px; max-height: 100px; overflow-y: auto;"></div>
    <button id="btnClearZones" style="margin-top: 4px;">Clear Zones</button>
  </div>

  <div class="section">
    <label>Grid</label>
    <div class="row">
      <button id="btnGridToggle">Grid: ON</button>
      <button id="btnClear">Clear All</button>
    </div>
  </div>

  <div class="section">
    <label>File</label>
    <div class="row">
      <button id="btnExport">Export JSON</button>
      <button id="btnImport">Import JSON</button>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none;">
  </div>

  <div class="section">
    <label>Info</label>
    <div id="info" style="font-size: 11px;">Pixels: 0 | Zones: 0</div>
  </div>
</div>

<div class="main">
  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="mainCanvas"></canvas>
  </div>

  <div class="preview-strip" id="previewStrip">
    <!-- Filled dynamically with class palette previews -->
  </div>

  <div class="status-bar">
    <span id="statusCoord">x: 0, y: 0</span>
    <span id="statusRole">Role: -</span>
    <span>48 × 48 | 12× zoom</span>
  </div>
</div>

<script>
// ──────────── Constants ────────────
const W = 48, H = 48, ZOOM = 12;
const ROLES = ['Outline', 'PrimShadow', 'PrimBase', 'PrimHigh', 'SecBase', 'SecHigh', 'Accent'];
const TRANSPARENT = 0xFF;

const CLASS_NAMES = ['Bulwark','Mantis','Leviathan','Tempest','Specter','Sentinel','Reaver','Abyss','Kraken','Ember'];

// Class palettes (from GAME_ASSET_SPEC)
const CLASS_PALETTES = [
  // [outline, primShadow, primBase, primHigh, secBase, secHigh, accent]
  [[ 26, 37, 51],[  41, 79,117],[  70,130,180],[120,170,210],[112,128,144],[150,165,175],[232,232,232]], // Bulwark
  [[  0, 46, 29],[   0,110, 70],[   0,168,107],[ 50,210,140],[ 26, 26, 26],[ 60, 60, 60],[255,255,  0]], // Mantis
  [[  0,  0, 48],[   0,  0, 82],[   0,  0,128],[ 40, 40,170],[205,127, 50],[225,165, 90],[ 74, 74, 74]], // Leviathan
  [[ 26, 58, 61],[  72,190,200],[125,249,255],[180,252,255],[240,248,255],[248,252,255],[  0,255,255]], // Tempest
  [[ 30, 24, 64],[  79, 60,170],[123,104,238],[165,145,255],[  0,139,139],[ 50,180,180],[224,224,255]], // Specter
  [[ 61, 50,  0],[ 180,150,  0],[255,215,  0],[255,230, 80],[255,250,240],[255,252,245],[240,230,208]], // Sentinel
  [[ 61,  5, 16],[ 150, 10, 35],[220, 20, 60],[240, 70, 95],[139,  0,  0],[180, 40, 40],[245,240,224]], // Reaver
  [[  0,  0,  0],[   5,  5,  5],[ 13, 13, 13],[ 40, 40, 40],[ 57,255, 20],[110,255, 80],[  0,255,128]], // Abyss
  [[  0, 32, 32],[   0, 90, 90],[  0,128,128],[ 50,170,170],[  0,191,255],[ 60,210,255],[ 10, 10, 10]], // Kraken
  [[ 61, 26,  0],[ 180, 60,  0],[255,102,  0],[255,150, 60],[255, 36,  0],[255, 90, 50],[255,255,  0]], // Ember
];

// ──────────── State ────────────
let grid = new Uint8Array(W * H).fill(TRANSPARENT);
let zones = [];
let selectedRole = 2; // primaryBase
let tool = 'draw';
let showGrid = true;
let mirror = false;
let isDrawing = false;
let lineStart = null;
let rectStart = null;
let zoneStart = null;
let eyedropMode = false;

// ──────────── Canvas ────────────
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W * ZOOM;
canvas.height = H * ZOOM;

function getRole(x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return TRANSPARENT;
  return grid[y * W + x];
}
function setRoleAt(x, y, role) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  grid[y * W + x] = role;
}

function rgbStr(rgb) { return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; }

function render() {
  const classId = parseInt(document.getElementById('classAffinity').value);
  const pal = CLASS_PALETTES[classId];

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw pixels
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const role = getRole(x, y);
      if (role !== TRANSPARENT) {
        ctx.fillStyle = rgbStr(pal[role] || pal[2]);
        ctx.fillRect(x * ZOOM, y * ZOOM, ZOOM, ZOOM);
      }
    }
  }

  // Grid lines
  if (showGrid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x++) {
      ctx.beginPath(); ctx.moveTo(x * ZOOM, 0); ctx.lineTo(x * ZOOM, H * ZOOM); ctx.stroke();
    }
    for (let y = 0; y <= H; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * ZOOM); ctx.lineTo(W * ZOOM, y * ZOOM); ctx.stroke();
    }
  }

  // Mutation zones
  zones.forEach((z, i) => {
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(z.x * ZOOM, z.y * ZOOM, z.w * ZOOM, z.h * ZOOM);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,102,0,0.1)';
    ctx.fillRect(z.x * ZOOM, z.y * ZOOM, z.w * ZOOM, z.h * ZOOM);
    ctx.fillStyle = '#ff6600';
    ctx.font = '10px monospace';
    ctx.fillText(`Z${i}`, z.x * ZOOM + 2, z.y * ZOOM + 10);
  });

  updateInfo();
  renderPreviews();
}

// ──────────── Palette Bar ────────────
function buildPaletteBar() {
  const bar = document.getElementById('paletteBar');
  bar.innerHTML = '';
  const classId = parseInt(document.getElementById('classAffinity').value);
  const pal = CLASS_PALETTES[classId];

  for (let i = 0; i < 7; i++) {
    const swatch = document.createElement('div');
    swatch.className = 'palette-swatch' + (i === selectedRole ? ' selected' : '');
    swatch.style.background = rgbStr(pal[i]);
    if (i === 0) swatch.style.border = '2px solid #888'; // Outline is dark
    swatch.onclick = () => { selectedRole = i; eyedropMode = false; buildPaletteBar(); };
    const label = document.createElement('div');
    label.className = 'role-label';
    label.textContent = i.toString();
    swatch.appendChild(label);
    bar.appendChild(swatch);
  }
}

// ──────────── Previews ────────────
function renderPreviews() {
  const strip = document.getElementById('previewStrip');
  strip.innerHTML = '';

  for (let c = 0; c < 10; c++) {
    const pal = CLASS_PALETTES[c];
    const item = document.createElement('div');
    item.className = 'preview-item';

    const pCanvas = document.createElement('canvas');
    pCanvas.width = W * 2; pCanvas.height = H * 2;
    pCanvas.style.width = (W * 2) + 'px'; pCanvas.style.height = (H * 2) + 'px';
    const pCtx = pCanvas.getContext('2d');

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const role = getRole(x, y);
        if (role !== TRANSPARENT) {
          pCtx.fillStyle = rgbStr(pal[role] || pal[2]);
          pCtx.fillRect(x * 2, y * 2, 2, 2);
        }
      }
    }

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = CLASS_NAMES[c];

    item.appendChild(pCanvas);
    item.appendChild(label);
    strip.appendChild(item);
  }
}

// ──────────── Mouse handlers ────────────
function canvasCoord(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - rect.left) / ZOOM),
    y: Math.floor((e.clientY - rect.top) / ZOOM)
  };
}

canvas.addEventListener('mousemove', (e) => {
  const {x, y} = canvasCoord(e);
  document.getElementById('statusCoord').textContent = `x: ${x}, y: ${y}`;
  const role = getRole(x, y);
  document.getElementById('statusRole').textContent = `Role: ${role === TRANSPARENT ? '-' : role + ' (' + ROLES[role] + ')'}`;

  if (isDrawing && tool === 'draw') {
    paint(x, y);
    render();
  }
});

canvas.addEventListener('mousedown', (e) => {
  const {x, y} = canvasCoord(e);

  if (eyedropMode) {
    const r = getRole(x, y);
    if (r !== TRANSPARENT) { selectedRole = r; buildPaletteBar(); }
    eyedropMode = false;
    return;
  }

  if (tool === 'draw') {
    isDrawing = true;
    paint(x, y);
    render();
  } else if (tool === 'line') {
    if (!lineStart) { lineStart = {x, y}; }
    else { drawLine(lineStart.x, lineStart.y, x, y); lineStart = null; render(); }
  } else if (tool === 'rect') {
    if (!rectStart) { rectStart = {x, y}; }
    else { drawRect(rectStart.x, rectStart.y, x, y); rectStart = null; render(); }
  } else if (tool === 'fill') {
    floodFill(x, y, selectedRole);
    render();
  } else if (tool === 'zone') {
    if (!zoneStart) { zoneStart = {x, y}; }
    else {
      const zx = Math.min(zoneStart.x, x), zy = Math.min(zoneStart.y, y);
      const zw = Math.abs(x - zoneStart.x) + 1, zh = Math.abs(y - zoneStart.y) + 1;
      zones.push({ x: zx, y: zy, w: zw, h: zh, allowed: ['add_pixels','remove_pixels','shift_pixels','thicken','pattern_fill','detail_overlay'] });
      zoneStart = null;
      updateZoneList();
      render();
    }
  }
});

canvas.addEventListener('mouseup', () => { isDrawing = false; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; });

function paint(x, y) {
  if (selectedRole === -1) { setRoleAt(x, y, TRANSPARENT); }
  else { setRoleAt(x, y, selectedRole); }
  if (mirror) {
    const mx = W - 1 - x;
    if (selectedRole === -1) { setRoleAt(mx, y, TRANSPARENT); }
    else { setRoleAt(mx, y, selectedRole); }
  }
}

function drawLine(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    paint(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}

function drawRect(x0, y0, x1, y1) {
  const minX = Math.min(x0, x1), maxX = Math.max(x0, x1);
  const minY = Math.min(y0, y1), maxY = Math.max(y0, y1);
  for (let y = minY; y <= maxY; y++)
    for (let x = minX; x <= maxX; x++)
      paint(x, y);
}

function floodFill(sx, sy, newRole) {
  const targetRole = getRole(sx, sy);
  if (targetRole === newRole) return;
  const stack = [[sx, sy]];
  const visited = new Set();
  while (stack.length) {
    const [x, y] = stack.pop();
    const key = y * W + x;
    if (visited.has(key)) continue;
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    if (getRole(x, y) !== targetRole) continue;
    visited.add(key);
    setRoleAt(x, y, newRole);
    stack.push([x-1,y],[x+1,y],[x,y-1],[x,y+1]);
  }
}

// ──────────── Tool buttons ────────────
const toolBtns = { draw: 'btnDraw', line: 'btnLine', rect: 'btnRect', fill: 'btnFill', zone: 'btnZone' };
Object.entries(toolBtns).forEach(([t, id]) => {
  document.getElementById(id).onclick = () => {
    tool = t; lineStart = null; rectStart = null; zoneStart = null;
    Object.values(toolBtns).forEach(bid => document.getElementById(bid).classList.remove('active'));
    document.getElementById(id).classList.add('active');
  };
});

document.getElementById('btnEraser').onclick = () => { selectedRole = -1; eyedropMode = false; buildPaletteBar(); };
document.getElementById('btnEyedrop').onclick = () => { eyedropMode = true; };
document.getElementById('btnMirror').onclick = (e) => {
  mirror = !mirror;
  e.target.classList.toggle('active', mirror);
};
document.getElementById('btnGridToggle').onclick = (e) => {
  showGrid = !showGrid;
  e.target.textContent = `Grid: ${showGrid ? 'ON' : 'OFF'}`;
  render();
};
document.getElementById('btnClear').onclick = () => { grid.fill(TRANSPARENT); render(); };
document.getElementById('btnClearZones').onclick = () => { zones = []; updateZoneList(); render(); };

document.getElementById('classAffinity').onchange = () => { buildPaletteBar(); render(); };
document.getElementById('bodyPart').onchange = render;

// ──────────── Zone list ────────────
function updateZoneList() {
  const list = document.getElementById('zoneList');
  list.innerHTML = zones.map((z, i) =>
    `<div>Z${i}: (${z.x},${z.y}) ${z.w}×${z.h} <button onclick="zones.splice(${i},1);updateZoneList();render();" style="font-size:10px;padding:1px 4px;">×</button></div>`
  ).join('');
}

// ──────────── Info ────────────
function updateInfo() {
  let count = 0;
  for (let i = 0; i < grid.length; i++) if (grid[i] !== TRANSPARENT) count++;
  document.getElementById('info').textContent = `Pixels: ${count} | Zones: ${zones.length}`;
}

// ──────────── Import / Export ────────────
document.getElementById('btnExport').onclick = () => {
  const bodyPart = document.getElementById('bodyPart').value;
  const classAffinity = parseInt(document.getElementById('classAffinity').value);

  // Build sparse pixels
  const pixels = [];
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const role = getRole(x, y);
      if (role !== TRANSPARENT) {
        pixels.push({ x, y, role });
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  const bounds = pixels.length > 0
    ? { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 }
    : { x: 0, y: 0, w: 0, h: 0 };

  // Default anchors
  const anchors = {
    carapace: {x:24,y:20}, claws: {x:12,y:28}, tail: {x:34,y:36},
    antennae: {x:18,y:10}, eyes: {x:16,y:18}, legs: {x:24,y:38}
  };

  const template = {
    bodyPart,
    classAffinity,
    version: 1,
    width: 48,
    height: 48,
    anchor: anchors[bodyPart] || {x:24,y:24},
    bounds,
    mutationZones: zones.map(z => ({
      x: z.x, y: z.y, w: z.w, h: z.h,
      allowed: z.allowed
    })),
    pixels
  };

  const json = JSON.stringify(template, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${CLASS_NAMES[classAffinity].toLowerCase()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('btnImport').onclick = () => {
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const template = JSON.parse(ev.target.result);
      grid.fill(TRANSPARENT);

      // Set controls
      document.getElementById('bodyPart').value = template.bodyPart;
      document.getElementById('classAffinity').value = template.classAffinity;

      // Load pixels
      if (template.pixels) {
        for (const p of template.pixels) {
          setRoleAt(p.x, p.y, p.role);
        }
      }

      // Load zones
      zones = (template.mutationZones || []).map(z => ({
        x: z.x, y: z.y, w: z.w, h: z.h,
        allowed: z.allowed || ['add_pixels','remove_pixels','shift_pixels','thicken','pattern_fill','detail_overlay']
      }));

      buildPaletteBar();
      updateZoneList();
      render();
    } catch (err) {
      alert('Failed to parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

// ──────────── Keyboard shortcuts ────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  const key = e.key;
  if (key >= '0' && key <= '6') { selectedRole = parseInt(key); eyedropMode = false; buildPaletteBar(); }
  if (key === 'e') { selectedRole = -1; eyedropMode = false; buildPaletteBar(); }
  if (key === 'i') { eyedropMode = true; }
  if (key === 'd') { document.getElementById('btnDraw').click(); }
  if (key === 'l') { document.getElementById('btnLine').click(); }
  if (key === 'r') { document.getElementById('btnRect').click(); }
  if (key === 'f') { document.getElementById('btnFill').click(); }
  if (key === 'z') { document.getElementById('btnZone').click(); }
  if (key === 'm') { document.getElementById('btnMirror').click(); }
  if (key === 'g') { document.getElementById('btnGridToggle').click(); }

  // Ctrl+Z undo (simple: not implemented — future enhancement)
  // Ctrl+S export
  if (e.ctrlKey && key === 's') { e.preventDefault(); document.getElementById('btnExport').click(); }
});

// ──────────── Init ────────────
buildPaletteBar();
render();
</script>
</body>
</html>
